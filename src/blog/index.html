---
layout: layouts/blog.html
title: Blog Page
---

<p>avaliable tags</p>
{% for tag in collections.tagList %}
<p>
  <a href="/blog/tag/{{ tag | slugify }}">{{ tag }}</a>
</p>
{% endfor %}

<h2>Post Lists</h2>
<ul>
  {% for post in collections.posts %}
  <li><a href="{{ post.url }}">{{ post.data.title }}</a></li>
  {% endfor %}
</ul>
